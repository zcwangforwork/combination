<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库 — 设计开发文档写作 Agent</title>
    <!-- [COMBINATION-PORT] 用户隔离：接收 SPA 经 URL #jwt= 片段传入的凭证并注入后续 API 请求 -->
    <script src="/static/token-relay.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }
        .topbar {
            padding: 10px 24px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
        }
        .topbar h2 { font-size: 16px; color: #333; }
        .topbar .spacer { flex: 1; }
        .topbar a, .topbar button {
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
        }
        .btn-back { background: #f5f5f5; color: #555; }
        .btn-back:hover { background: #e0e0e0; }
        .btn-upload { background: #1976d2; color: #fff; }
        .btn-upload:hover { background: #1565c0; }
        .btn-upload:disabled { background: #bdbdbd; cursor: not-allowed; }

        .main {
            flex: 1;
            display: flex;
            min-height: 0;
        }
        /* ── 左栏：文件管理 ── */
        .files-panel {
            width: 460px;
            min-width: 380px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .files-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        .files-header .cnt { font-size: 12px; color: #999; font-weight: normal; margin-left: 8px; }
        .files-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
        .files-list table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .files-list th { text-align: left; padding: 6px; color: #666; border-bottom: 2px solid #e0e0e0; }
        .files-list td { padding: 7px 6px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        .files-list .empty { color: #999; text-align: center; padding: 40px 0; }
        .mini-btn {
            border: 1px solid #00897b; background: #fff; color: #00897b;
            border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer; margin-right: 4px;
        }
        .mini-btn.danger { border-color: #e57373; color: #e53935; }
        .files-footer { padding: 8px 16px; border-top: 1px solid #e0e0e0; font-size: 11px; color: #999; display: flex; align-items: center; gap: 8px; }
        .btn-batch-add {
            border: none; background: #00897b; color: #fff;
            border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer;
        }
        .btn-batch-add:disabled { background: #bdbdbd; cursor: not-allowed; }

        /* ── 右栏：问答区 ── */
        .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 16px 24px;
            display: flex; flex-direction: column; gap: 12px; background: #fafbfc;
        }
        .chat-msg { max-width: 76%; font-size: 14px; line-height: 1.7; word-break: break-word; white-space: pre-wrap; }
        .chat-msg.user {
            align-self: flex-end; background: #1976d2; color: #fff;
            padding: 10px 14px; border-radius: 12px 12px 2px 12px;
        }
        .chat-msg.agent {
            align-self: flex-start; background: #fff; color: #333;
            padding: 10px 14px; border-radius: 12px 12px 12px 2px; border: 1px solid #e8e8e8;
        }
        .chat-msg.agent .sources { margin-top: 10px; font-size: 12px; color: #777; border-top: 1px dashed #e0e0e0; padding-top: 8px; white-space: normal; }
        .chat-msg.agent .sources b { color: #455; }
        .chat-input-area {
            border-top: 1px solid #e0e0e0; padding: 12px 16px; background: #fff; display: flex; gap: 8px;
        }
        .chat-input-area textarea {
            flex: 1; min-height: 44px; max-height: 120px; resize: none;
            border: 1px solid #d5d5d5; border-radius: 8px; padding: 8px 10px;
            font-size: 14px; font-family: inherit; line-height: 1.5;
        }
        .chat-input-area textarea:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 0 2px rgba(25,118,210,0.15); }
        .btn-send {
            align-self: flex-end; background: #1976d2; color: #fff; border: none;
            padding: 9px 22px; border-radius: 8px; font-size: 14px; cursor: pointer;
        }
        .btn-send:hover { background: #1565c0; }
        .btn-send:disabled { background: #bdbdbd; cursor: not-allowed; }

        .toast {
            position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
            background: #323232; color: #fff; padding: 8px 18px; border-radius: 6px;
            font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.25s; pointer-events: none;
            max-width: 80%;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 900px) {
            .main { flex-direction: column; }
            .files-panel { width: 100%; min-width: 0; max-height: 40%; }
            .chat-panel { flex: 1; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h2>📚 知识库</h2>
        <span style="font-size:12px;color:#999">上传文件入库后可在此检索提问；也可勾选文件添加到会话附件</span>
        <span class="spacer"></span>
        <button id="kbUploadBtn" class="btn-upload" onclick="triggerKbUpload()">📤 上传文件到知识库</button>
        <a class="btn-back" href="/agent">返回 Agent 对话</a>
    </div>
    <div class="main">
        <!-- 左栏：文件管理 -->
        <div class="files-panel">
            <div class="files-header">知识库文件<span class="cnt" id="fileCount"></span></div>
            <div class="files-list" id="filesList">
                <div class="empty">加载中...</div>
            </div>
            <div class="files-footer">
                <span id="selectedCount" style="color:#00897b">已选 0 个</span>
                <span class="spacer" style="flex:1"></span>
                <button id="kbBatchAddBtn" class="btn-batch-add" onclick="addSelectedKbFiles()">批量添加到附件</button>
            </div>
        </div>
        <!-- 右栏：问答区 -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-msg agent">你好！这里是知识库问答。我已经读取了你上传到知识库的全部文件内容，可以直接就其中的标准、法规、参数、流程等提问，我会检索知识库并基于检索结果回答。</div>
            </div>
            <div class="chat-input-area">
                <textarea id="chatInput" placeholder="对知识库文件提问，Enter 发送（Shift+Enter 换行）"
                    onkeydown="handleChatKeydown(event)" oninput="autoGrow(this)"></textarea>
                <button class="btn-send" id="btnSend" onclick="askKb()">提问</button>
            </div>
        </div>
    </div>
    <input type="file" id="kbFileInput" style="display:none" multiple
        accept=".docx,.pdf,.txt,.doc,.ppt,.pptx,.xls,.xlsx,.png,.jpg,.jpeg,.bmp,.tiff,.tif,.html,.htm"
        onchange="handleKbFileSelect(event)">

    <script>
        const KB_MAX_SIZE_BYTES = 20 * 1024 * 1024;
        const KB_ALLOWED_FORMATS = ['.docx', '.pdf', '.txt', '.doc', '.ppt', '.pptx', '.xls', '.xlsx',
            '.png', '.jpg', '.jpeg', '.bmp', '.tiff', '.tif', '.html', '.htm'];
        // 从 agent 页跳转时带上 project，用于"批量添加到附件"
        const urlParams = new URLSearchParams(window.location.search);
        const PROJECT_ID = urlParams.get('project') || '';
        let kbFiles = [];   // 缓存当前列表，供多选批量添加
        let asking = false;

        function esc(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ── Toast ──
        let toastEl = null;
        function showToast(text, ms = 3500) {
            if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
            toastEl.textContent = text;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), ms);
        }

        // ── 文件上传 ──
        function triggerKbUpload() { document.getElementById('kbFileInput').click(); }

        async function handleKbFileSelect(event) {
            const files = Array.from(event.target.files || []);
            event.target.value = '';
            if (!files.length) return;
            const btn = document.getElementById('kbUploadBtn');
            btn.disabled = true;
            let ok = 0, fail = 0;
            for (const f of files) { (await uploadFileToKb(f)) ? ok++ : fail++; }
            btn.disabled = false;
            showToast(`上传完成：成功 ${ok} 个，失败 ${fail} 个`, fail ? 5000 : 3500);
            if (ok > 0) await loadFiles();
        }

        function validateKbFile(file) {
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            if (!KB_ALLOWED_FORMATS.includes(ext)) return `不支持的文件格式「${ext}」`;
            if (file.size > KB_MAX_SIZE_BYTES) return `文件「${file.name}」超过 20MB 限制`;
            if (file.size === 0) return '文件为空';
            return '';
        }

        async function uploadFileToKb(file) {
            const err = validateKbFile(file);
            if (err) { showToast(err); return false; }
            try {
                const fd = new FormData();
                fd.append('file', file);
                fd.append('persist', 'true');
                const resp = await fetch('/api/upload', { method: 'POST', body: fd });
                if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
                const fileId = (await resp.json()).file_id;
                for (let i = 0; i < 600; i++) {
                    await new Promise(r => setTimeout(r, 1500));
                    const stResp = await fetch('/api/extract-status/' + fileId);
                    if (stResp.status === 404) throw new Error('提取任务已丢失，请重试');
                    if (!stResp.ok) throw new Error('查询提取状态失败');
                    const st = await stResp.json();
                    if (st.status === 'failed') throw new Error(st.message || '提取失败');
                    if (st.status === 'completed') {
                        showToast(`✓「${file.name}」已入库知识库`);
                        return true;
                    }
                }
                throw new Error('提取超时');
            } catch (e) {
                showToast(`✗「${file.name}」上传失败: ${e.message}`);
                return false;
            }
        }

        // ── 文件列表 ──
        async function loadFiles() {
            const list = document.getElementById('filesList');
            list.innerHTML = '<div class="empty">加载中...</div>';
            try {
                const resp = await fetch('/api/kb/files');
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
                kbFiles = data.files || [];
                document.getElementById('fileCount').textContent = kbFiles.length ? `（共 ${kbFiles.length} 个）` : '';
                if (!kbFiles.length) {
                    list.innerHTML = '<div class="empty">知识库中暂无文件，请先上传。</div>';
                    updateBatchAddBtn();
                    return;
                }
                let html = '<table><thead><tr><th style="width:30px;text-align:center"><input type="checkbox" id="kbSelectAll" onchange="toggleSelectAll(this)"></th><th>文件名</th><th style="text-align:right;width:70px">分块</th><th style="text-align:center;width:90px">操作</th></tr></thead><tbody>';
                for (const f of kbFiles) {
                    const hasOrig = f.original_filename && f.original_filename !== f.source_file;
                    const name = hasOrig ? f.original_filename : f.source_file;
                    const note = hasOrig ? '' : ' <span style="color:#ff9800;font-size:11px">(旧文件)</span>';
                    html += '<tr>';
                    html += `<td style="text-align:center"><input type="checkbox" class="kb-file-check" data-source="${esc(f.source_file)}" data-file-id="${esc(f.file_id || '')}" data-name="${esc(name)}" onchange="updateSelectedCount()"></td>`;
                    html += `<td style="word-break:break-all">${esc(name)}${note}</td>`;
                    html += `<td style="text-align:right;color:#888">${f.chunk_count}</td>`;
                    html += `<td style="text-align:center;white-space:nowrap"><button class="mini-btn" data-source="${esc(f.source_file)}" data-name="${esc(name)}" onclick="deleteKbFile(this)">删除</button></td>`;
                    html += '</tr>';
                }
                html += '</tbody></table>';
                list.innerHTML = html;
                updateBatchAddBtn();
                updateSelectedCount();
            } catch (e) {
                list.innerHTML = `<div class="empty" style="color:#e53935">加载失败: ${esc(e.message)}</div>`;
            }
        }

        function toggleSelectAll(master) {
            document.querySelectorAll('.kb-file-check').forEach(cb => cb.checked = master.checked);
            updateSelectedCount();
        }
        // 批量添加按钮状态：无项目上下文时置灰并提示（需从 Agent 对话页带 project 进入）
        function updateBatchAddBtn() {
            const btn = document.getElementById('kbBatchAddBtn');
            if (!PROJECT_ID) {
                btn.disabled = true;
                btn.title = '请从 Agent 对话页（查看知识库）进入以启用批量添加附件';
            } else {
                btn.disabled = false;
                btn.title = '将勾选的文件批量加入当前会话附件';
            }
        }
        function updateSelectedCount() {
            const boxes = Array.from(document.querySelectorAll('.kb-file-check'));
            const checked = boxes.filter(cb => cb.checked);
            const master = document.getElementById('kbSelectAll');
            if (master) master.checked = boxes.length > 0 && checked.length === boxes.length;
            document.getElementById('selectedCount').textContent = `已选 ${checked.length} 个`;
        }

        async function deleteKbFile(btn) {
            const sourceFile = btn.getAttribute('data-source');
            const name = btn.getAttribute('data-name') || sourceFile;
            if (!confirm(`确定从知识库删除「${name}」吗？删除后不再参与检索。`)) return;
            btn.disabled = true;
            try {
                const resp = await fetch('/api/kb/files/delete', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source_file: sourceFile }),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
                showToast(`✓ 已删除「${name}」`);
                await loadFiles();
            } catch (e) {
                btn.disabled = false;
                showToast(`删除失败: ${e.message}`);
            }
        }

        // ── 多选批量添加到附件（需 project 参数） ──
        async function addSelectedKbFiles() {
            if (!PROJECT_ID) { showToast('缺少项目上下文，无法添加附件'); return; }
            const boxes = Array.from(document.querySelectorAll('.kb-file-check:checked'));
            if (!boxes.length) { showToast('请先勾选要添加的文件'); return; }
            const files = boxes.map(cb => ({
                source_file: cb.getAttribute('data-source'),
                file_id: cb.getAttribute('data-file-id') || '',
                filename: cb.getAttribute('data-name') || '',
            }));
            const btn = document.getElementById('kbBatchAddBtn');
            btn.disabled = true;
            btn.textContent = `添加中 (${files.length})...`;
            try {
                const resp = await fetch(`/api/agent/projects/${PROJECT_ID}/attachments/from-kb/batch`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files }),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
                showToast(data.message || `✓ 已添加 ${data.added_count} 个文件到附件`);
                await loadFiles();   // loadFiles 会经 updateBatchAddBtn 复位按钮
            } catch (e) {
                showToast(`批量添加失败: ${e.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = '批量添加到附件';
            }
        }

        // ── 知识库问答 ──
        function handleChatKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askKb(); }
        }
        function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; }

        function appendMsg(role, text, sources) {
            const box = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-msg ' + role;
            div.innerHTML = esc(text).replace(/\n/g, '<br>');
            if (sources && sources.length) {
                div.innerHTML += '<div class="sources"><b>参考来源：</b>' + sources.map(s => esc(s.source_file)).join('、') + '</div>';
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            return div;
        }

        async function askKb() {
            if (asking) return;
            const input = document.getElementById('chatInput');
            const q = input.value.trim();
            if (!q) return;
            input.value = ''; input.style.height = 'auto';
            appendMsg('user', q);
            asking = true;
            document.getElementById('btnSend').disabled = true;
            try {
                const resp = await fetch('/api/kb/chat', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q }),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
                appendMsg('agent', data.answer || '（无回答）', data.sources || []);
            } catch (e) {
                appendMsg('agent', '❌ 问答失败：' + e.message);
            } finally {
                asking = false;
                document.getElementById('btnSend').disabled = false;
            }
        }

        // ── Init ──
        loadFiles();
    </script>
</body>
</html>
