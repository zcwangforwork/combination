# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/user_management
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL logging for debugging
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

# JWT — 密钥支持环境变量 UM_JWT_SECRET 覆盖（与 FastAPI Agent 服务共享同一变量；
# 未设置时回退此默认值。轮换密钥时：同时改两服务环境变量并重启，存量登录态将全部失效）
app.jwt.secret=${UM_JWT_SECRET:insulin-pump-employee-mgmt-secret-key-2026-please-change-in-production}
app.jwt.expiration-ms=86400000

# CORS (frontend dev server)
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081

# Logging
logging.level.com.insulinpump=DEBUG

# File upload (Document management)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
