<div v-show="activeMenu === 'agent-review'" class="agent-review-page">
<div id="ar-root" v-pre>

        <!-- 审核服务不可用横幅（由 agent-review.js 控制） -->
        <div class="ar-service-error" id="arServiceError" style="display:none">
            <div>⚠ 无法连接文档审核 Agent 服务（已尝试端口 8012 / 8013 / 8014）。</div>
            <div style="font-size:12px;color:#b71c1c;margin-top:4px">请确认审核服务已启动（见 combination/README.md），然后重试。</div>
            <button onclick="AgentReview.activate(true)">重试连接</button>
        </div>

<div class="header">
  <div class="logo">
    文档审核数字员工<span class="agent-badge">对话模式</span>
  </div>
  <div class="nav">
    <button class="ar-back-btn" onclick="AgentReview.backToSystem()" title="返回体系文档管理系统">⟵ 返回系统</button>
    <button id="ar-historyBtn" onclick="openSessionList()"
            style="background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border);padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;">
      🕘 历史会话
    </button>
    <button id="ar-uploadDocBtn" onclick="returnToUpload()"
            style="background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;">
      📄 上传文档审核
    </button>
  </div>
</div>

<div class="progress-bar-wrap" id="ar-progressBarWrap" style="display:none;">
  <div class="progress-stages">
    <div class="progress-stage" data-stage="intake">
      <div class="dot">0</div><span class="label">文档接收</span>
    </div>
    <div class="progress-stage" data-stage="strategy">
      <div class="dot">1</div><span class="label">策略规划</span>
    </div>
    <div class="progress-stage" data-stage="audit">
      <div class="dot">2</div><span class="label">逐章审核</span>
    </div>
    <div class="progress-stage" data-stage="cross_validate">
      <div class="dot">3</div><span class="label">交叉验证</span>
    </div>
    <div class="progress-stage" data-stage="report">
      <div class="dot">4</div><span class="label">报告生成</span>
    </div>
    <div class="progress-stage" data-stage="revision">
      <div class="dot">5</div><span class="label">交互修订</span>
    </div>
  </div>
</div>

<div class="chat-container" id="ar-chatContainer">
  <div class="chat-messages" id="ar-chatMessages"></div>
  <div class="input-area" id="ar-inputArea">
    <div class="input-row">
      <input type="text" id="ar-messageInput" placeholder="输入反馈或建议..."
             onkeydown="if(event.key==='Enter')arSendMessage()" disabled>
      <button id="ar-sendBtn" onclick="arSendMessage()" disabled>发送</button>
    </div>
  </div>
</div>

<!-- Upload overlay (hidden by default — page loads directly into chat) -->
<div class="upload-overlay hidden" id="ar-uploadOverlay">
  <div class="upload-card">
    <h2>开始对话式审核</h2>
    <p class="subtitle">上传一份体系文件，与 Agent 进行交互式审核</p>
    <div class="upload-zone" id="ar-uploadZone" onclick="document.getElementById('ar-fileInput').click()">
      <div class="icon">📄</div>
      <p>点击或拖拽上传文件</p>
      <div class="file-types">支持 .docx / .pdf</div>
    </div>
    <input type="file" id="ar-fileInput" accept=".docx,.pdf" style="display:none" onchange="arHandleFileSelect(event)">
    <div class="file-selected" id="ar-fileInfo">
      <span class="remove" onclick="removeFile()">✕</span>
      <div class="name" id="ar-fileName"></div>
      <div class="size" id="ar-fileSize"></div>
    </div>
    <div class="form-row">
      <label for="ar-auditType">审核领域</label>
      <select id="ar-auditType">
        <option value="risk_management">风险管理专项</option>
        <option value="design_dev">设计开发专项</option>
        <option value="software_compliance">软件合规专项</option>
        <option value="registration">注册申报专项</option>
        <option value="production_quality">生产质量专项</option>
        <option value="system_construction">体系建设专项</option>
        <option value="general">综合体系审核</option>
      </select>
    </div>
    <div class="form-row">
      <label for="ar-agentMode">Agent 模式</label>
      <select id="ar-agentMode">
        <option value="single">单 Agent（支持交互修订）</option>
        <option value="multi" selected>多 Agent 协作（章节级并行，速度更快）</option>
      </select>
    </div>
    <button class="btn" id="ar-startConvBtn" onclick="startConversation()"
            style="width:100%;padding:10px;background:var(--accent-purple);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;">
      开始对话审核
    </button>
    <p style="font-size:11px;color:var(--text-secondary);margin-top:8px;text-align:center;">
      提示：不上传文档也可开始自由对话，直接提问法规/体系问题
    </p>
  </div>
</div>

<!-- P0 优化：历史会话列表弹层 -->
<div class="session-list-overlay hidden" id="ar-sessionListOverlay">
  <div class="session-list-card">
    <div class="session-list-head">
      <h3>🕘 历史会话</h3>
      <button class="sl-close" onclick="closeSessionList()">✕</button>
    </div>
    <div class="sl-body" id="ar-sessionListBody"></div>
  </div>
</div>


</div>
</div>
